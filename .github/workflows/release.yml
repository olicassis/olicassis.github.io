name: Release

# release-please keeps a release PR open with the next version and the changelog. Merging that PR
# tags vX.Y.Z and creates a GitHub release. It starts only after CI passes on main.
#
# A PR opened with the default GITHUB_TOKEN does not start CI, so required checks never report on
# the release PR. Add a fine-grained token as the RELEASE_PLEASE_TOKEN secret (contents and pull
# requests: read and write, this repo only) to fix that.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
