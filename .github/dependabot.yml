version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps): 📦'
    groups:
      astro:
        patterns: ['astro', '@astrojs/*', 'prettier-plugin-astro']
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Follows the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps): 👷'
    groups:
      actions:
        patterns: ['*']
