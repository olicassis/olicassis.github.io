name: Content change
description: Add or correct a career, project or progress entry, or the about text.
labels: [content]
body:
  - type: dropdown
    id: section
    attributes:
      label: Section
      options: [about, career, projects, progress]
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: The change
      description: The facts to add or correct. Give dates, names and links exactly.
    validations:
      required: true
